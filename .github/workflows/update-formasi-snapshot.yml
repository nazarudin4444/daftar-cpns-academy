name: Update BKN formation snapshot

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-formasi-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fetch and sanitize official BKN snapshot
        run: node scripts/sync-formasi.mjs
      - name: Commit snapshot when data changes
        run: |
          if git diff --quiet -- public/data/formasi.json; then
            echo "Snapshot has not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/formasi.json
          git commit -m "chore: update BKN formasi snapshot"
          git push
